<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CalendarAsist - Tu Asistente de Calendario y Agenda Universitaria</title>
    <meta name="description" content="Asistente de calendario, agenda universitaria y seguimiento de deberes y entregas diarias." />
    <meta property="og:title" content="CalendarAsist - Calendario & Deberes Universitarios" />
    <meta property="og:description" content="Organiza tus asignaturas, deberes, entrenamientos y agenda diaria en tiempo real." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Prevent stale caching in iOS Safari standalone WebClips -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- iOS Safari Home Screen Web App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CalendarAsist" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Standard Web App & Browser Theming -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-blocking font load: the app paints with the system font and swaps when the web font arrives -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"></noscript>
    <script>
      // Solo modo claro
      document.documentElement.classList.remove('dark');
    </script>
    <script>
      (function() {
        var originalError = console.error;
        console.error = function() {
          if (arguments.length > 0 && typeof arguments[0] === 'string' && (arguments[0].indexOf('[vite]') !== -1 || arguments[0].indexOf('vite') !== -1)) {
            console.debug.apply(console, arguments);
            return;
          }
          originalError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body class="bg-white text-ink antialiased selection:bg-accent selection:text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
