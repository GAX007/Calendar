[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["vite"]

[functions."sync-moodle"]
  schedule = "0 */2 * * *"

# Direct sync-now endpoint
[[redirects]]
  from = "/sync-now"
  to = "/.netlify/functions/sync-now"
  status = 200
  force = true

[[redirects]]
  from = "/api/sync-now"
  to = "/.netlify/functions/sync-now"
  status = 200
  force = true

[[redirects]]
  from = "/api/moodle/sync-now"
  to = "/.netlify/functions/sync-now"
  status = 200
  force = true

# Proxy API calls to the serverless Express function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA client-side fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control rules to prevent iOS PWA stale cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

